name: Compatibility report
description: Report a verified board / BIOS / token / reboot outcome.
title: '[compatibility] Board + BIOS version'
body:
  - type: markdown
    attributes:
      value: 'Share sanitized evidence only. Do not attach full BIOS exports, CPU-Z reports, serial numbers or customer paths.'
  - type: input
    id: hardware
    attributes:
      label: Board, revision, CPU and full BIOS version
    validations:
      required: true
  - type: input
    id: tools
    attributes:
      label: Windows and Intel ITK package / command-line tool versions
    validations:
      required: true
  - type: textarea
    id: token
    attributes:
      label: Sanitized virtualization token section and INI version
      render: ini
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Write output, exit code, restart method and post-boot Windows status
      description: 'Distinguish the manual procedure from wrapper validation. State whether physical confirmation was required.'
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Evidence hygiene
      options:
        - label: I removed private identifiers and did not attach binary installers or full firmware exports.
          required: true
