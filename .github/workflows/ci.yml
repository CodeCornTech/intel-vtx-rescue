name: Offline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  powershell:
    runs-on: windows-latest
    strategy:
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Parse PowerShell source
        shell: ${{ matrix.shell }}
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem scripts,tests -Filter '*.ps1' -Recurse | ForEach-Object {
            $tokens = $null; $parseErrors = $null
            [Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
      - name: Test token boundaries and platform guards without ITK
        shell: ${{ matrix.shell }}
        run: ./tests/Test-Offline.ps1
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: bash -n scripts/repo-init.sh
      - run: python3 tests/check-repository.py
