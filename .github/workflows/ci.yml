name: Offline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  powershell:
    name: Windows PowerShell 5.1
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Parse PowerShell source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem scripts,tests -Filter '*.ps1' -Recurse | ForEach-Object {
            $tokens = $null; $parseErrors = $null
            [Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
      - name: Test token boundaries and platform guards without ITK
        shell: powershell
        run: ./tests/Test-Offline.ps1
  pwsh:
    name: PowerShell Core
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Parse PowerShell source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem scripts,tests -Filter '*.ps1' -Recurse | ForEach-Object {
            $tokens = $null; $parseErrors = $null
            [Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
      - name: Test token boundaries and platform guards without ITK
        shell: pwsh
        run: ./tests/Test-Offline.ps1
  bootstrap:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, X64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: bash -n scripts/repo-init.sh
      - run: python3 tests/check-repository.py
